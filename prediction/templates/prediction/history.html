<!DOCTYPE html>
<html>
<head>
    <title>Prediction History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
        }

        .navbar {
            background: #1f3c88;
            color: white;
            padding: 18px 40px;
        }

        .container {
            width: 90%;
            margin: 40px auto;
        }

        h1 {
            color: #1f3c88;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1f3c88;
            color: white;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #1f3c88;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Fake Job Posting Detection System</h2>
    </div>

    <div class="container">

        <h1>Prediction History</h1>

        {% if history %}

        <table>
            <tr>
                <th>Job Title</th>
                <th>Result</th>
                <th>Date</th>
            </tr>

            {% for item in history %}
            <tr>
                <td>{{ item.job_title }}</td>
                <td>{{ item.result }}</td>
                <td>{{ item.created_at|date:"d M Y, h:i A" }}</td>
            </tr>
            {% endfor %}

        </table>

        {% else %}

        <p>No prediction history available.</p>

        {% endif %}

        <a href="/predict/" class="button">
            Analyze Another Job
        </a>

    </div>

</body>
</html>
